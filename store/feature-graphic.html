<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Feature graphic 1024x500</title>
<style>
  /* Feature graphic da Play Store: 1024x500 exatos, sem alpha.
     Renderizado por scripts/make-feature-graphic.mjs via Chrome headless. */
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{width:1024px; height:500px; overflow:hidden;}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
    background:#0d1220;
    display:flex; align-items:center;
    position:relative;
  }

  /* Brilhos nas cores do Google, atras do conteudo */
  .glow{position:absolute; border-radius:50%; filter:blur(85px); opacity:.72;}
  .g1{width:560px; height:560px; left:-200px; top:-230px; background:#4285f4;}
  .g2{width:470px; height:470px; left:120px; bottom:-280px; background:#34a853;}
  .g3{width:400px; height:400px; right:-110px; top:-170px; background:#ea4335; opacity:.5;}
  .g4{width:360px; height:360px; right:90px; bottom:-230px; background:#fbbc05; opacity:.4;}

  /* Vinheta pra manter o texto legivel sobre os brilhos */
  .veil{position:absolute; inset:0; background:
    linear-gradient(100deg, rgba(9,13,24,.84) 0%, rgba(9,13,24,.66) 48%, rgba(9,13,24,.78) 100%);}

  /* Zona segura: a Play recorta as bordas em alguns formatos */
  .safe{position:relative; display:flex; align-items:center; gap:52px; padding:0 84px; width:100%;}

  .icon{
    width:184px; height:184px; flex-shrink:0; border-radius:42px; overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.09);
  }
  .icon img{width:100%; height:100%; display:block; object-fit:cover;}

  .copy{min-width:0;}
  h1{
    font-size:62px; line-height:1.04; font-weight:800; letter-spacing:-1.6px;
    color:#fff; margin-bottom:18px;
    text-shadow:0 2px 24px rgba(0,0,0,.5);
  }
  h1 .accent{
    background:linear-gradient(97deg,#5b9bff,#3ddc84);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  p.tag{
    font-size:25px; line-height:1.35; font-weight:400; color:#b7c4d8;
    max-width:600px; margin-bottom:26px;
  }
  .badges{display:flex; gap:11px; flex-wrap:wrap;}
  .badge{
    font-size:15px; font-weight:600; color:#dbe5f2;
    background:rgba(255,255,255,.085); border:1px solid rgba(255,255,255,.16);
    padding:9px 17px; border-radius:999px; white-space:nowrap;
  }
</style>
</head>
<body>
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="glow g3"></div>
  <div class="glow g4"></div>
  <div class="veil"></div>

  <div class="safe">
    <div class="icon"><img src="icon-512.png" alt=""></div>
    <div class="copy">
      <h1><span id="t1">Gmail</span> <span class="accent" id="t2">Cleaner Buddy</span></h1>
      <p class="tag" id="tag"></p>
      <div class="badges" id="badges"></div>
    </div>
  </div>

<script>
  var COPY = {
    'pt-BR': {
      tag: 'Descubra quem mais lota sua caixa de entrada — e mande tudo pra lixeira com um toque.',
      badges: ['Ranking Top 10', 'Limpeza em 1 toque', 'Sem salvar senha']
    },
    'en-US': {
      tag: 'Find out who floods your inbox the most — and trash it all with a single tap.',
      badges: ['Top 10 ranking', 'One-tap cleanup', 'No password stored']
    },
    'es-ES': {
      tag: 'Descubre quién llena más tu bandeja — y envíalo todo a la papelera con un toque.',
      badges: ['Ranking Top 10', 'Limpieza en 1 toque', 'Sin guardar contraseña']
    },
    'fr-FR': {
      tag: 'Découvrez qui encombre le plus votre boîte — et videz tout en un seul appui.',
      badges: ['Classement Top 10', 'Nettoyage en 1 appui', 'Aucun mot de passe']
    },
    'it-IT': {
      tag: 'Scopri chi intasa di più la tua casella — e svuota tutto con un solo tocco.',
      badges: ['Classifica Top 10', 'Pulizia in 1 tocco', 'Nessuna password salvata']
    },
    'ru-RU': {
      tag: 'Узнайте, кто больше всего забивает ваш ящик — и очистите всё одним касанием.',
      badges: ['Рейтинг Топ-10', 'Очистка в 1 касание', 'Пароль не сохраняется']
    },
    'zh-CN': {
      tag: '看看谁最占用你的收件箱 —— 一键将其全部清空。',
      badges: ['前 10 名排行榜', '一键清理', '不保存密码']
    }
  };

  var lang = new URLSearchParams(location.search).get('lang') || 'pt-BR';
  var c = COPY[lang] || COPY['pt-BR'];
  document.getElementById('tag').textContent = c.tag;
  document.getElementById('badges').innerHTML =
    c.badges.map(function (b) { return '<span class="badge">' + b + '</span>'; }).join('');
</script>
</body>
</html>
